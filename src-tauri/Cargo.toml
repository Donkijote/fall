[package]
name = "TheFall"
version = "0.2.0"
description = "The Fall Card Game"
authors = ["Donkijote"]
license-file = "../LICENSE"
repository = "https://github.com/Donkijote/fall"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "=2.12.7", features = [] }
tauri-plugin-log = "2"
