name: Deploy Cloudflare Preview

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Trusted branch to deploy to an isolated Preview
        required: true
        default: develop
        type: string
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: preview-fall-${{ github.event.pull_request.number || inputs.branch }}
  cancel-in-progress: true

jobs:
  preview:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      url: ${{ steps.preview.outputs.url }}

    steps:
      - name: Checkout Preview revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm check

      - name: Tests
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      - name: Deploy isolated Preview
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}
          PREVIEW_BRANCH: ${{ inputs.branch }}
        run: |
          if [ -z "$PREVIEW_NAME" ]; then
            PREVIEW_NAME="branch-$(printf '%s' "$PREVIEW_BRANCH" | sha256sum | cut -c1-12)"
          fi
          output="$(pnpm exec wrangler preview --name "$PREVIEW_NAME" --json)"
          printf '%s\n' "$output"
          url="$(printf '%s\n' "$output" | sed -n '/^{/,$p' | jq -er '.preview.urls[0]')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '### Cloudflare Preview\n\nName: `%s`\n\n%s\n' "$PREVIEW_NAME" "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Probe Preview deep link
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: >-
          curl --fail --silent --show-error --retry 5 --retry-all-errors
          --retry-delay 2 --header 'Accept: text/html'
          "$PREVIEW_URL/login" --output /dev/null
