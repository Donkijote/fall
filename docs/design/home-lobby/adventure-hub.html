<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fall · Hearth adventure hubs</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        background: transparent;
      }
      #adventure-review {
        font:
          14px/1.5 system-ui,
          sans-serif;
        color: #f2e2ce;
      }
      #adventure-review * {
        box-sizing: border-box;
      }
      #adventure-review h1,
      #adventure-review h2,
      #adventure-review p {
        margin: 0;
      }
      #adventure-review button,
      #adventure-review select {
        font: inherit;
      }
      #adventure-review button {
        color: inherit;
        cursor: pointer;
      }
      #adventure-review button:focus-visible,
      #adventure-review select:focus-visible {
        outline: 3px solid #f3b275;
        outline-offset: 3px;
      }
      .review-switcher {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 0 0 12px;
        color: light-dark(#392e2a, #f2e2ce);
      }
      .review-switcher label {
        font-size: 12px;
      }
      .review-switcher select {
        min-height: 44px;
        max-width: 100%;
        padding: 7px 30px 7px 12px;
        border: 1px solid #74574b;
        border-radius: 6px;
        background: #281d1b;
        color: #f2e2ce;
      }
      .review-switcher span {
        margin-left: auto;
        font-size: 11px;
        color: light-dark(#775d50, #b7a295);
      }
      .hub {
        --ember: #d2653e;
        --gold: #d6ad70;
        --ash: #bcab9c;
        --edge: #6d4b37;
        position: relative;
        isolation: isolate;
        overflow: hidden;
        border: 1px solid #5c3b2e;
        border-radius: 14px;
        background: #1b1314;
        box-shadow: inset 0 0 0 3px #221b18;
      }
      .hub [hidden] {
        display: none !important;
      }
      .hud {
        position: relative;
        z-index: 3;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        padding: 16px 22px;
        background: linear-gradient(#241b19, #241b19df);
        border-bottom: 1px solid #59402e;
      }
      .traveller {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .portrait {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border: 2px solid #ad7a48;
        outline: 2px solid #372b21;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 26%, #b67750, #3f2925 64%);
        color: #f2c595;
        font:
          24px Georgia,
          serif;
      }
      .traveller strong {
        display: block;
        font:
          17px Georgia,
          serif;
      }
      .traveller small,
      .hud-meta small {
        display: block;
        color: var(--ash);
        font-size: 11px;
      }
      .hud-meta {
        display: flex;
        gap: 18px;
        align-items: center;
      }
      .hud-meta .region {
        color: var(--gold);
        font:
          14px Georgia,
          serif;
        text-align: right;
      }
      .hud button {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border: 1px solid var(--edge);
        border-radius: 50%;
        background: #2a211c;
        color: var(--gold);
        font-size: 22px;
      }
      .world {
        position: relative;
        isolation: isolate;
        min-height: 435px;
        background: radial-gradient(ellipse at 48% 74%, #7f41232b, transparent 60%);
      }
      .backdrop {
        position: absolute;
        z-index: -3;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 42%;
        opacity: 0.43;
        filter: sepia(0.4) saturate(0.65);
        pointer-events: none;
      }
      .world::before {
        content: "";
        position: absolute;
        z-index: -2;
        inset: 0;
        background: linear-gradient(#261a1a22, #27191c66 48%, #171211 100%);
      }
      .world::after {
        content: "";
        z-index: -1;
        position: absolute;
        inset: 45% -10% -8%;
        border-radius: 50% 50% 0 0;
        background: radial-gradient(ellipse at 47% 45%, #70452b 0, #35261f 30%, #211a16 65%);
        transform: perspective(450px) rotateX(12deg);
        box-shadow: inset 0 8px 10px #ad77431a;
      }
      .world-title {
        position: relative;
        z-index: 1;
        text-align: center;
        padding: 15px 120px 0;
        pointer-events: none;
      }
      .kicker {
        display: block;
        color: var(--gold);
        font-size: 10px;
        letter-spacing: 0.17em;
        text-transform: uppercase;
      }
      .world-title h1 {
        font:
          28px/1.2 Georgia,
          serif;
        margin-top: 4px !important;
        text-shadow: 0 3px 9px #100a09;
      }
      .world-title p {
        margin-top: 3px !important;
        color: var(--ash);
        font-size: 11px;
      }
      .quick-access {
        position: absolute;
        top: 12px;
        left: 15px;
        z-index: 3;
        display: grid;
        gap: 5px;
      }
      .quick-access button {
        display: flex;
        gap: 7px;
        align-items: center;
        padding: 8px 10px;
        min-height: 44px;
        border: 1px solid #795035;
        background: linear-gradient(90deg, #33241fed, #38261ddd);
        border-radius: 4px 10px 10px 4px;
        font-size: 11px;
      }
      .quick-access button span {
        color: #e1ab6c;
        font-size: 18px;
      }
      .paths {
        position: absolute;
        left: 15%;
        right: 10%;
        top: 51%;
        bottom: 9%;
        border: 14px solid #98714b1c;
        border-top: 0;
        border-radius: 0 0 50% 50%;
        transform: rotate(-5deg);
        pointer-events: none;
      }
      .landmark {
        position: absolute;
        z-index: 2;
        width: 150px;
        height: 155px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding: 0;
        border: 0;
        background: transparent;
        filter: drop-shadow(0 10px 8px #100b09a0);
      }
      .landmark .plaque {
        display: grid;
        justify-items: center;
        min-width: 116px;
        padding: 6px 12px;
        border: 1px solid #ad7b48;
        background: linear-gradient(#543923, #2c2019);
        border-radius: 3px 10px 3px 10px;
        box-shadow: 0 3px 0 #17120e;
        line-height: 1.2;
      }
      .landmark strong {
        color: #f0dfbd;
        font:
          16px Georgia,
          serif;
      }
      .landmark small {
        color: #bdac93;
        font-size: 10px;
        margin-top: 4px;
      }
      .landmark:hover .plaque,
      .landmark[aria-pressed="true"] .plaque {
        border-color: #f4b975;
        background: linear-gradient(#70462a, #3a241b);
      }
      .landmark[aria-pressed="true"] .plaque {
        box-shadow: 0 0 18px #ee823644;
      }
      .building {
        position: relative;
        display: block;
        width: 120px;
        height: 100px;
      }
      .building .walls {
        position: absolute;
        bottom: 0;
        left: 17%;
        width: 66%;
        height: 65%;
        background:
          repeating-linear-gradient(0deg, transparent 0 19px, #241a1a66 20px 22px),
          linear-gradient(90deg, #4c3230, #795044 54%, #38292b);
        border: 2px solid #9d715247;
      }
      .building .roof {
        position: absolute;
        bottom: 60%;
        left: 5%;
        width: 90%;
        height: 46%;
        clip-path: polygon(50% 0, 100% 100%, 0 100%);
        background: linear-gradient(120deg, #a15038, #4e282a);
      }
      .building .door {
        position: absolute;
        bottom: 0;
        left: 42%;
        width: 20%;
        height: 38%;
        border-radius: 40% 40% 0 0;
        background: linear-gradient(#edbd72, #a34323);
        box-shadow: 0 0 15px #ee9b4c55;
        border: 3px solid #35231d;
      }
      .building .windows {
        position: absolute;
        bottom: 42%;
        left: 26%;
        width: 9%;
        height: 12%;
        background: #e8af63;
        box-shadow:
          47px 0 #d9964d,
          0 0 12px #eaa15e;
      }
      .tavern {
        left: 7%;
        top: 174px;
      }
      .tavern .building {
        width: 155px;
        transform: rotate(-3deg);
      }
      .tavern .building::after {
        content: "";
        position: absolute;
        left: 67%;
        top: -9px;
        width: 14px;
        height: 39px;
        background: #4a3432;
        border-top: 3px solid #8d6250;
      }
      .tavern small {
        color: #e6b581;
      }
      .campaign {
        top: 119px;
        left: calc(50% - 85px);
        width: 170px;
        height: 200px;
      }
      .portal-art {
        position: relative;
        display: grid;
        place-items: center;
        width: 106px;
        height: 140px;
        margin-bottom: 5px;
        border: 12px ridge #8f6050;
        border-radius: 48% 48% 20% 20%;
        background: radial-gradient(ellipse, #f5c481, #d85b2a 28%, #68251d 60%, #2f1619 74%);
        box-shadow:
          0 0 30px #ee753c59,
          inset 0 0 20px #f4b660;
      }
      .portal-art::before {
        content: "";
        position: absolute;
        inset: 10px;
        border: 1px solid #f5c386;
        border-radius: 50%;
        transform: rotate(-20deg);
      }
      .portal-art::after {
        content: "";
        width: 31px;
        height: 47px;
        border: 1px solid #f4d496;
        background: #3c161bd1;
        border-radius: 4px;
        transform: rotate(-10deg);
        box-shadow: 9px 2px 0 -3px #b47b42;
      }
      .campaign .plaque {
        border-color: #dc9c56;
        background: linear-gradient(#7c4027, #41231c);
      }
      .campaign strong {
        font-size: 20px;
      }
      .tower {
        right: 5%;
        top: 17px;
        width: 130px;
        height: 202px;
      }
      .tower .building {
        height: 143px;
        width: 90px;
      }
      .tower .walls {
        height: 87%;
        left: 25%;
        width: 52%;
        clip-path: polygon(18% 0, 82% 0, 100% 100%, 0 100%);
      }
      .tower .roof {
        height: 37%;
        bottom: 80%;
      }
      .tower .windows {
        bottom: 51%;
        left: 44%;
        height: 15%;
        box-shadow: 0 33px #bd6d3d;
      }
      .tower .door {
        left: 43%;
      }
      .expedition {
        top: 40px;
        left: 22%;
        width: 140px;
        height: 135px;
      }
      .expedition .building {
        width: 110px;
        height: 77px;
      }
      .expedition .walls {
        width: 90%;
        left: 5%;
        height: 65%;
        background: #4e3a2b;
        clip-path: polygon(50% 0, 100% 100%, 0 100%);
      }
      .expedition .roof {
        bottom: 7%;
        height: 91%;
        background: linear-gradient(115deg, #9d7750 50%, #64442f 51%);
      }
      .expedition .door {
        left: 43%;
        height: 55%;
        background: #291b19;
        border: 0;
        border-radius: 60% 0 0 0;
      }
      .expedition .windows {
        display: none;
      }
      .arena {
        top: 248px;
        right: 6%;
        height: 144px;
      }
      .arena .building {
        width: 140px;
        height: 90px;
      }
      .arena .walls {
        width: 92%;
        left: 4%;
        height: 78%;
        border-radius: 45% 45% 5% 5%;
        background: repeating-linear-gradient(
          90deg,
          #3b2928 0 10px,
          #805748 11px 19px,
          #503731 20px 26px
        );
      }
      .arena .roof {
        height: 15%;
        width: 97%;
        left: 1%;
        bottom: 65%;
        background: #b18963;
        clip-path: ellipse(50% 50%);
      }
      .arena .windows {
        display: none;
      }
      .arena .door {
        height: 55%;
        width: 25%;
        left: 37%;
      }
      .camp .world {
        min-height: 435px;
      }
      .camp .world::after {
        inset: 53% -15% -10%;
        background: radial-gradient(ellipse at 50% 52%, #9c562d, #38261e 32%, #1d1715 65%);
      }
      .camp .campaign {
        left: auto;
        right: 8%;
        top: 170px;
        width: 155px;
        height: 180px;
      }
      .camp .campaign .portal-art {
        width: 87px;
        height: 115px;
      }
      .camp .tavern {
        left: calc(50% - 78px);
        top: 235px;
      }
      .camp .tavern .building {
        display: none;
      }
      .camp .expedition {
        top: 166px;
        left: 8%;
      }
      .camp .tower {
        top: 23px;
        right: 6%;
        height: 150px;
        opacity: 0.8;
      }
      .camp .tower .building {
        height: 95px;
        width: 65px;
      }
      .camp .arena {
        top: 80px;
        left: 25%;
        right: auto;
        height: 132px;
      }
      .camp .arena .building {
        width: 100px;
        height: 62px;
      }
      .campfire {
        display: none;
        position: absolute;
        top: 186px;
        left: calc(50% - 55px);
        width: 110px;
        height: 110px;
        border-radius: 50%;
        background: radial-gradient(ellipse at 50% 80%, #f3a14677, transparent 67%);
      }
      .camp .campfire {
        display: block;
      }
      .campfire::before {
        content: "";
        position: absolute;
        left: 28px;
        top: 15px;
        width: 54px;
        height: 70px;
        background: radial-gradient(ellipse at bottom, #ffde8b 15%, #eb7833 50%, #9f3221 80%);
        border-radius: 80% 0 65% 35%;
        transform: rotate(-25deg);
        box-shadow: 0 0 35px #df71394d;
      }
      .campfire::after {
        content: "";
        position: absolute;
        bottom: 14px;
        left: 16px;
        width: 80px;
        height: 12px;
        background: #875532;
        border: 3px solid #4b3026;
        transform: rotate(-9deg);
        border-radius: 10px;
      }
      .map .world {
        background: #302321;
      }
      .map .backdrop {
        opacity: 0.12;
        object-position: center 30%;
      }
      .map .world::after {
        inset: 10% 9% 1%;
        border-radius: 0;
        transform: none;
        background: linear-gradient(145deg, #65432c, #432c24 65%, #5c3828);
        clip-path: polygon(
          15% 4%,
          41% 14%,
          55% 0,
          78% 8%,
          95% 34%,
          84% 57%,
          100% 80%,
          65% 96%,
          44% 84%,
          17% 99%,
          0 73%,
          10% 50%,
          0 29%
        );
        box-shadow: none;
      }
      .map .paths {
        left: 22%;
        right: 16%;
        top: 30%;
        bottom: 19%;
        border: 2px dashed #c7996066;
        transform: rotate(-17deg);
        border-radius: 43%;
      }
      .map .landmark {
        height: 95px;
      }
      .map .building {
        display: none;
      }
      .map .landmark::before {
        content: "◈";
        display: grid;
        place-items: center;
        height: 39px;
        width: 39px;
        border: 1px solid #c89762;
        border-radius: 50%;
        color: #e4b882;
        background: #30201c;
        font-size: 24px;
        margin-bottom: 7px;
        box-shadow: 0 0 0 5px #b6813b1c;
      }
      .map .campaign {
        top: 124px;
        left: calc(50% - 85px);
        height: 140px;
      }
      .map .campaign::before {
        display: none;
      }
      .map .portal-art {
        height: 74px;
        width: 60px;
        border-width: 5px;
      }
      .map .portal-art::after {
        height: 25px;
        width: 18px;
      }
      .map .tavern {
        top: 264px;
        left: 12%;
      }
      .map .expedition {
        top: 119px;
        left: 7%;
      }
      .map .tower {
        top: 88px;
        right: 6%;
      }
      .map .arena {
        top: 271px;
        right: 13%;
      }
      .dock {
        position: relative;
        display: flex;
        justify-content: center;
        gap: 7px;
        padding: 10px 18px 15px;
        border-top: 1px solid #69492e;
        background: linear-gradient(#2b211b, #1a1513);
      }
      .dock button {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        width: 83px;
        min-height: 67px;
        padding: 6px;
        border: 0;
        border-bottom: 2px solid transparent;
        background: transparent;
        font-size: 11px;
        color: #c4b198;
      }
      .dock .sigil {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border: 1px solid #967149;
        border-radius: 50%;
        background: radial-gradient(circle at 40% 30%, #60412d, #30211d);
        font:
          20px Georgia,
          serif;
        box-shadow: inset 0 0 0 3px #35251d;
      }
      .dock button[aria-pressed="true"] {
        color: #f2ce95;
        border-bottom-color: #d3854b;
      }
      .dock button[aria-pressed="true"] .sigil {
        border-color: #e3b174;
        background: radial-gradient(circle at 40% 30%, #a05b32, #40251f);
      }
      .selection {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        align-items: center;
        padding: 12px 20px;
        border-top: 1px solid #50382b;
        background: #211a17;
      }
      .selection .description {
        flex: 1 1 290px;
        min-width: 0;
      }
      .selection strong {
        color: #ecc797;
        font:
          17px Georgia,
          serif;
      }
      .selection p {
        color: #c0ae9d;
        font-size: 11px;
        margin-top: 3px !important;
      }
      .selection button {
        padding: 10px 16px;
        min-height: 44px;
        border: 1px solid #d48752;
        background: linear-gradient(#a84b2b, #70311f);
        border-radius: 5px;
        font-size: 12px;
      }
      .selection button:disabled {
        background: #362820;
        border-color: #71503a;
        color: #c6ac91;
        cursor: default;
      }
      .concept-note {
        margin: 10px 2px 0 !important;
        color: light-dark(#775d50, #b9a294);
        font-size: 11px;
      }
      .preview-modes {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 12px 20px;
        background: #251c18;
      }
      .preview-modes button {
        min-height: 44px;
        color: #efd5b2;
        border: 1px solid #9e6946;
        border-radius: 4px;
        background: #3e2920;
        padding: 8px 12px;
        font-size: 12px;
      }
      @media (max-width: 600px) {
        .review-switcher span {
          width: 100%;
          margin: 0;
        }
        .hud {
          padding: 12px;
          gap: 8px;
        }
        .hud-meta {
          gap: 9px;
        }
        .hud-meta .region {
          font-size: 12px;
        }
        .world-title {
          padding: 18px 15px 0;
        }
        .world-title h1 {
          font-size: 25px;
        }
        .quick-access {
          position: relative;
          top: auto;
          left: auto;
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          padding: 12px 10px 0;
        }
        .world,
        .camp .world,
        .map .world {
          display: grid;
          grid-template-columns: 1fr 1fr;
          min-height: 0;
          padding-bottom: 14px;
        }
        .world-title,
        .quick-access {
          grid-column: 1 / -1;
        }
        .world .landmark,
        .camp .world .landmark,
        .map .world .landmark {
          position: relative;
          inset: auto;
          width: 100%;
          height: 155px;
          padding: 8px 0;
        }
        .world .campaign,
        .camp .world .campaign,
        .map .world .campaign {
          grid-column: 1 / -1;
          grid-row: 3;
          height: 181px;
        }
        .world .campaign .portal-art,
        .camp .world .campaign .portal-art {
          width: 78px;
          height: 111px;
        }
        .world .tavern .building {
          width: 127px;
        }
        .camp .world .tavern .building {
          display: block;
        }
        .camp .world .tower {
          opacity: 1;
        }
        .world .tower .building {
          width: 70px;
          height: 92px;
        }
        .world .arena .building {
          width: 119px;
        }
        .map .world .landmark {
          height: 125px;
        }
        .map .world .campaign {
          height: 154px;
        }
        .campfire,
        .camp .campfire,
        .paths {
          display: none;
        }
        .dock {
          flex-wrap: wrap;
          gap: 2px;
          padding: 9px 5px;
        }
        .dock button {
          flex: 1 0 48px;
          max-width: 80px;
          width: auto;
          font-size: 10px;
        }
        .selection {
          padding: 12px;
        }
        .selection .description {
          flex-basis: 100%;
        }
        .selection button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main id="adventure-review">
      <div class="review-switcher">
        <label for="hub-layout">Explore a layout</label
        ><select id="hub-layout">
          <option value="town">Emberfall · town hub</option>
          <option value="camp">Wayfarer’s Rest · camp hub</option>
          <option value="map">Ashen Atlas · realm hub</option></select
        ><span>Hearth palette / adventure RPG direction</span>
      </div>
      <div id="hub-variants"></div>
      <p class="concept-note">
        Design exploration · world names and RPG destinations are proposals, not implemented modes.
        No economy, level progression, or monetization is assumed.
      </p>
    </main>
    <template id="hub-template">
      <section class="hub" aria-label="Adventure hub concept">
        <header class="hud">
          <div class="traveller">
            <span class="portrait" aria-hidden="true">M</span>
            <div><strong>Manuel</strong><small>A traveller at the Hearth</small></div>
          </div>
          <div class="hud-meta">
            <div class="region"><span>Emberfall</span><small>Sanctuary · world concept</small></div>
            <button type="button" data-destination="settings" aria-label="Settings concept">
              ⚙
            </button>
          </div>
        </header>
        <div class="world">
          <img class="backdrop" src="../../../src/assets/login/mountain-castle.png" alt="" />
          <div class="world-title">
            <span class="kicker">FALL / the hearthlands</span>
            <h1>Emberfall</h1>
            <p>Every path begins with a hand.</p>
          </div>
          <nav class="quick-access" aria-label="Adventure shortcuts">
            <button type="button" data-destination="journal">
              <span aria-hidden="true">☷</span>Journal</button
            ><button type="button" data-destination="events">
              <span aria-hidden="true">✧</span>World events
            </button>
          </nav>
          <span class="paths" aria-hidden="true"></span
          ><span class="campfire" aria-hidden="true"></span>
          <button
            type="button"
            class="landmark tavern"
            data-destination="caida"
            aria-pressed="false"
          >
            <span class="building" aria-hidden="true"
              ><span class="walls"></span><span class="roof"></span><span class="windows"></span
              ><span class="door"></span></span
            ><span class="plaque"
              ><strong>The Tavern</strong><small>Caída · existing game</small></span
            >
          </button>
          <button
            type="button"
            class="landmark campaign"
            data-destination="campaign"
            aria-pressed="true"
          >
            <span class="portal-art" aria-hidden="true"></span
            ><span class="plaque"><strong>Adventure</strong><small>Campaign concept</small></span>
          </button>
          <button
            type="button"
            class="landmark tower"
            data-destination="trials"
            aria-pressed="false"
          >
            <span class="building" aria-hidden="true"
              ><span class="walls"></span><span class="roof"></span><span class="windows"></span
              ><span class="door"></span></span
            ><span class="plaque"><strong>The Spire</strong><small>Trials concept</small></span>
          </button>
          <button
            type="button"
            class="landmark expedition"
            data-destination="expeditions"
            aria-pressed="false"
          >
            <span class="building" aria-hidden="true"
              ><span class="walls"></span><span class="roof"></span><span class="windows"></span
              ><span class="door"></span></span
            ><span class="plaque"
              ><strong>Expeditions</strong><small>Exploration concept</small></span
            >
          </button>
          <button
            type="button"
            class="landmark arena"
            data-destination="arena"
            aria-pressed="false"
          >
            <span class="building" aria-hidden="true"
              ><span class="walls"></span><span class="roof"></span><span class="windows"></span
              ><span class="door"></span></span
            ><span class="plaque"><strong>The Arena</strong><small>Challenge concept</small></span>
          </button>
        </div>
        <nav class="dock" aria-label="Player systems">
          <button type="button" data-destination="home" aria-pressed="true">
            <span class="sigil" aria-hidden="true">⌂</span>Hearth</button
          ><button type="button" data-destination="deck" aria-pressed="false">
            <span class="sigil" aria-hidden="true">▱</span>Deck</button
          ><button type="button" data-destination="character" aria-pressed="false">
            <span class="sigil" aria-hidden="true">♙</span>Character</button
          ><button type="button" data-destination="inventory" aria-pressed="false">
            <span class="sigil" aria-hidden="true">▣</span>Inventory</button
          ><button type="button" data-destination="journal" aria-pressed="false">
            <span class="sigil" aria-hidden="true">☷</span>Journal</button
          ><button type="button" data-destination="codex" aria-pressed="false">
            <span class="sigil" aria-hidden="true">✧</span>Codex
          </button>
        </nav>
        <div class="selection" aria-live="polite">
          <div class="description">
            <strong data-selection-title>Adventure / beyond the gates</strong>
            <p data-selection-copy>
              A place for card-driven stories, encounters, and future game modes. Campaign rules are
              still to be designed.
            </p>
          </div>
          <button type="button" data-action disabled>Campaign concept</button>
        </div>
        <div class="preview-modes" hidden aria-label="Caída preview modes">
          <button type="button" data-mode="1vs1">1 vs 1</button
          ><button type="button" data-mode="1vs2">3 players</button
          ><button type="button" data-mode="2vs2">2 vs 2</button>
        </div>
      </section>
    </template>
    <script>
      const review = document.getElementById("adventure-review");
      const variants = document.getElementById("hub-variants");
      const template = document.getElementById("hub-template");
      const concepts = [
        { id: "town", name: "Emberfall", subtitle: "Every path begins with a hand." },
        {
          id: "camp",
          name: "Wayfarer’s Rest",
          subtitle: "Regroup. Refine your deck. Choose the next road.",
        },
        { id: "map", name: "The Ashen Atlas", subtitle: "One world. Many ways to play." },
      ];
      const destinations = {
        campaign: [
          "Adventure / beyond the gates",
          "A place for card-driven stories, encounters, and future game modes. Campaign rules are still to be designed.",
          "Campaign concept",
        ],
        caida: [
          "The Tavern / classic Caída",
          "The existing card game lives here as one destination, not the whole lobby. Preview a bot-play mode below.",
          "Preview game modes",
        ],
        trials: [
          "The Spire / trials",
          "Proposed home for focused card challenges. Rules, rewards, and unlock conditions are intentionally undefined.",
          "Trials concept",
        ],
        expeditions: [
          "Expeditions / the roads beyond",
          "A proposed exploration destination. This does not commit to timers, energy, or offline rewards.",
          "Exploration concept",
        ],
        arena: [
          "The Arena / challenges",
          "A proposed home for competitive or challenge formats. No online matchmaking or ranking is implemented.",
          "Arena concept",
        ],
        home: [
          "The Hearth / your sanctuary",
          "A persistent home between adventures. Select a landmark to inspect its role.",
          "Home concept",
        ],
        deck: [
          "Deck / prepare your cards",
          "Space for a future deck or card-collection system. Deckbuilding rules are not yet decided.",
          "Deck concept",
        ],
        character: [
          "Character / your adventurer",
          "A proposed player or party area. Classes, equipment, stats, and progression remain product decisions.",
          "Character concept",
        ],
        inventory: [
          "Inventory / what you carry",
          "A place reserved for an eventual inventory system. No items or currencies are granted by this preview.",
          "Inventory concept",
        ],
        journal: [
          "Journal / the next thread",
          "A future home for story goals and quest tracking, without notification spam or invented daily reward loops.",
          "Journal concept",
        ],
        codex: [
          "Codex / learn the world",
          "Rules and Sings already exist in the app. Lore and additional mode guides could grow here later.",
          "Codex concept",
        ],
        events: [
          "World events / changing horizons",
          "An optional future destination for rotating adventures. No calendar, countdown, or live event service is assumed.",
          "Events concept",
        ],
        settings: [
          "Settings / a quiet utility",
          "Reserve a consistent place for appearance, sound, and accessibility. These settings are not wired in the sketch.",
          "Settings concept",
        ],
      };
      for (const concept of concepts) {
        const fragment = template.content.cloneNode(true);
        const hub = fragment.querySelector(".hub");
        hub.classList.add(concept.id);
        hub.dataset.variant = concept.id;
        hub.hidden = concept.id !== "town";
        hub.setAttribute("aria-label", `${concept.name} adventure hub`);
        hub.querySelector("h1").textContent = concept.name;
        hub.querySelector(".world-title p").textContent = concept.subtitle;
        hub.querySelector(".region > span").textContent = concept.name;
        variants.append(fragment);
      }
      document.getElementById("hub-layout").addEventListener("change", (event) => {
        for (const hub of variants.children)
          hub.hidden = hub.dataset.variant !== event.target.value;
      });
      review.addEventListener("click", (event) => {
        if (!(event.target instanceof Element)) return;
        const button = event.target.closest("button");
        if (!button) return;
        const hub = button.closest(".hub");
        const modePanel = hub.querySelector(".preview-modes");
        if (button.dataset.destination) {
          const destination = button.dataset.destination;
          const [title, copy, action] = destinations[destination];
          hub.querySelector("[data-selection-title]").textContent = title;
          hub.querySelector("[data-selection-copy]").textContent = copy;
          const actionButton = hub.querySelector("[data-action]");
          actionButton.textContent = action;
          actionButton.disabled = destination !== "caida";
          modePanel.hidden = true;
          for (const landmark of hub.querySelectorAll(".landmark"))
            landmark.setAttribute(
              "aria-pressed",
              String(landmark.dataset.destination === destination),
            );
          for (const dockButton of hub.querySelectorAll(".dock button"))
            dockButton.setAttribute(
              "aria-pressed",
              String(dockButton.dataset.destination === destination),
            );
        } else if (button.hasAttribute("data-action")) {
          modePanel.hidden = !modePanel.hidden;
        } else if (button.dataset.mode) {
          const labels = { "1vs1": "1 vs 1", "1vs2": "3-player free-for-all", "2vs2": "2 vs 2" };
          hub.querySelector("[data-selection-copy]").textContent =
            `Preview only: ${labels[button.dataset.mode]} with bots. A real implementation would use the existing game setup flow; this sketch does not start a match.`;
        }
      });
    </script>
  </body>
</html>
